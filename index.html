    <script type="text/javascript">
      // GitHub Pages caches index.html (~10 min) but asset filenames are
      // content-hashed, so just after a deploy a returning visitor can get
      // stale HTML pointing at bundles that no longer exist — every script
      // 404s and the page renders blank. Detect that nothing mounted and
      // reload once (reload revalidates the document), then give up so a
      // genuine app error can't cause a refresh loop.
      (function () {
        var KEY = "imango-stale-asset-reload";
        window.addEventListener("load", function () {
          window.setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0) {
              try { sessionStorage.removeItem(KEY); } catch (e) {}
              return;
            }
            try {
              if (sessionStorage.getItem(KEY)) return;
              sessionStorage.setItem(KEY, "1");
            } catch (e) {
              return;
            }
            window.location.reload();
          }, 3000);
        });
      })();
    </script>

    <script type="text/javascript">
      // Decode the redirect from 404.html (see public/404.html) back into a
      // real path before React Router mounts.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .filter(function (s) {
              // Drop the cache-busting token 404.html adds so it never
              // shows up in the address bar.
              return s.indexOf("__cb=") !== 0;
            })
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("imango-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
